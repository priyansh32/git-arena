apiVersion: v1
kind: Namespace
metadata:
  name: gitarena-api
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitarena-sessions
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-backend
  namespace: gitarena-api
  annotations:
    iam.gke.io/gcp-service-account: ${GCP_API_GSA_EMAIL}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-workspace-manager
  namespace: gitarena-sessions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-backend-session-workspace-manager
  namespace: gitarena-sessions
subjects:
  - kind: ServiceAccount
    name: api-backend
    namespace: gitarena-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-workspace-manager
---
apiVersion: v1
kind: Secret
metadata:
  name: gitarena-api-env
  namespace: gitarena-api
type: Opaque
stringData:
  NODE_ENV: "${NODE_ENV}"
  PORT: "3001"
  DATABASE_URL: "postgres://gitarena:${DB_PASSWORD_URLENC}@127.0.0.1:5432/gitarena"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
  CORS_ORIGINS: "${CORS_ORIGINS}"
  SESSION_COOKIE_NAME: "gitarena_session"
  SESSION_TTL_HOURS: "168"
  WORKSPACE_PROVIDER: "kubernetes"
  WORKSPACE_IMAGE: "${WORKSPACE_IMAGE}"
  WORKSPACE_K8S_NAMESPACE: "gitarena-sessions"
  WORKSPACE_K8S_RUNTIME_CLASS_NAME: "gvisor"
  WORKSPACE_K8S_IMAGE_PULL_POLICY: "IfNotPresent"
  WORKSPACE_K8S_POD_READY_TIMEOUT_SECONDS: "240"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitarena-api
  namespace: gitarena-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      serviceAccountName: api-backend
      containers:
        - name: api
          image: ${API_IMAGE}
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: gitarena-api-env
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "${INSTANCE_CONNECTION_NAME}"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gitarena-api-backendconfig
  namespace: gitarena-api
spec:
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gitarena-api
  namespace: gitarena-api
  annotations:
    cloud.google.com/backend-config: '{"default": "gitarena-api-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: api-backend
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitarena-api-ingress
  namespace: gitarena-api
  annotations:
    ingress.gcp.kubernetes.io/pre-shared-cert: "${API_PRE_SHARED_CERT_NAME}"
    kubernetes.io/ingress.allow-http: "false"
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "${API_GLOBAL_STATIC_IP_NAME}"
spec:
  ingressClassName: gce
  rules:
    - host: "${API_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitarena-api
                port:
                  number: 80
