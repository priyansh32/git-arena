apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-backend
  namespace: gitarena-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-workspace-manager
  namespace: gitarena-sessions
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-backend-session-workspace-manager
  namespace: gitarena-sessions
subjects:
  - kind: ServiceAccount
    name: api-backend
    namespace: gitarena-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-workspace-manager
