name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API tests
        run: npm run test -w @gitarena/api

      - name: Build
        run: npm run build

      - name: Start stack
        run: ./launch.sh start

      - name: Smoke test stack
        run: ./launch.sh smoke

      - name: Stop stack
        if: always()
        run: ./launch.sh stop --volumes --remove-orphans
