name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @gitarena/shared

      - name: API typecheck
        run: npm run typecheck -w @gitarena/api

      - name: API unit tests
        run: npm run test -w @gitarena/api

      - name: Web typecheck
        run: npm run typecheck -w @gitarena/web

      - name: Env templates lint
        run: npm run env:lint
