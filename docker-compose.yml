services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitarena
      POSTGRES_USER: gitarena
      POSTGRES_PASSWORD: gitarena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitarena -d gitarena"]
      interval: 10s
      timeout: 5s
      retries: 5

  workspace-image:
    image: ${WORKSPACE_IMAGE:-gitarena-base:2.43.7-alpine3.19-v1}
    build:
      context: apps/workspace
      dockerfile: Dockerfile
    command: ["sh", "-lc", "echo workspace image prepared"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      WEB_PORT: ${TEST_WEB_PORT:-5173}
      DATABASE_URL: postgres://gitarena:gitarena@postgres:5432/gitarena
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUTH_TEST_MODE: ${AUTH_TEST_MODE:-true}
      AUTH_TEST_ALLOWED_EMAILS: ${AUTH_TEST_ALLOWED_EMAILS:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gitarena_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      WORKSPACE_PROVIDER: docker
      WORKSPACE_IMAGE: ${WORKSPACE_IMAGE:-gitarena-base:2.43.7-alpine3.19-v1}
      WORKSPACE_ROOT: /workspace
      WORKSPACE_SHELL: /bin/bash
      WORKSPACE_CONTAINER_PREFIX: gitarena-ws
      WORKSPACE_INIT_COMMAND: mkdir -p /workspace && cd /workspace && exec tail -f /dev/null
    depends_on:
      postgres:
        condition: service_healthy
      workspace-image:
        condition: service_completed_successfully
    ports:
      - "${TEST_API_PORT:-3001}:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TEST_WEB_PORT:-5173}:80"
      
volumes:
  postgres_data:
