services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitarena
      POSTGRES_USER: gitarena
      POSTGRES_PASSWORD: gitarena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitarena -d gitarena"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://gitarena:gitarena@postgres:5432/gitarena
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gitarena_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      WORKSPACE_IMAGE: alpine/git:2.47.2
      WORKSPACE_ROOT: /workspace
      WORKSPACE_SHELL: /bin/sh
      WORKSPACE_CONTAINER_PREFIX: gitarena-ws
      WORKSPACE_INIT_COMMAND: mkdir -p /workspace && cd /workspace && exec tail -f /dev/null
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
