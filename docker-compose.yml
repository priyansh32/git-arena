services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitarena
      POSTGRES_USER: gitarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gitarenadb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitarena -d gitarena"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net
    restart: unless-stopped

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      DELETE: 1
    networks:
      - proxy-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgres://gitarena:${POSTGRES_PASSWORD}@postgres:5432/gitarena
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUTH_TEST_MODE: ${AUTH_TEST_MODE:-false}
      AUTH_TEST_ALLOWED_EMAILS: ${AUTH_TEST_ALLOWED_EMAILS:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gitarena_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_SECRET: ${SESSION_SECRET}
      WORKSPACE_PROVIDER: docker
      WORKSPACE_CONTAINER_PREFIX: gitarena-ws
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net
      - proxy-net
      - app-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  app-net:
  db-net:
  proxy-net:

volumes:
  gitarenadb:
