services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitarena
      POSTGRES_USER: gitarena
      POSTGRES_PASSWORD: gitarena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitarena -d gitarena"]
      interval: 10s
      timeout: 5s
      retries: 5

  workspace-image:
    image: ${WORKSPACE_IMAGE:-gitarena-base:2.43.7-alpine3.19-v1}
    build:
      context: apps/workspace
      dockerfile: Dockerfile
    command: ["sh", "-lc", "echo workspace image prepared"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: ${API_PORT:-3001}
      WEB_PORT: ${WEB_PORT:-5173}
      DATABASE_URL: postgres://gitarena:gitarena@postgres:5432/gitarena
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gitarena_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      WORKSPACE_PROVIDER: docker
      WORKSPACE_IMAGE: ${WORKSPACE_IMAGE:-gitarena-base:2.43.7-alpine3.19-v1}
      WORKSPACE_ROOT: /workspace
      WORKSPACE_SHELL: /bin/bash
      WORKSPACE_CONTAINER_PREFIX: gitarena-ws
      WORKSPACE_INIT_COMMAND: mkdir -p /workspace && cd /workspace && exec tail -f /dev/null
    depends_on:
      postgres:
        condition: service_healthy
      workspace-image:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${API_PORT:-3001}/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    environment:
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      WEB_PORT: ${WEB_PORT:-5173}
      API_PORT: ${API_PORT:-3001}
      VITE_API_PROXY_HOST: api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"

volumes:
  postgres_data:
